<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!--
      The deployment is publicly reachable from the first deploy, long before
      launch. It stays out of search results until #30 says otherwise; the
      robots.txt in public/ says the same thing to crawlers that never parse
      this document.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      The app icon (scripts/pwa/render-icons.ts). The manifest, linked in by
      the build, carries the installed app's icons; iOS reads its home-screen
      icon from apple-touch-icon instead.
    -->
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Toploader" />

    <!-- The browser's frame around the page matches --color-bg. -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0b0c"
      media="(prefers-color-scheme: dark)"
    />

    <title>Toploader</title>
    <meta
      name="description"
      content="Organize in-person trades with other Pokemon TCG collectors in your city."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
