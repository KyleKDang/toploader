# The authority on validation: what is green here is green. Runs on every
# push to every branch, and on main it then applies new migrations to the
# hosted database and deploys the edge functions. Render deploys main only
# after every check on the commit passes (render.yaml), so the schema always
# lands before the app that uses it.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pushes to a branch are cancelled. A run on main is never
  # cancelled mid-migration; at most a queued one is skipped for a newer one,
  # whose db push applies every migration still pending.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  static:
    name: Typecheck, lint, format, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  suites:
    name: Seams 1-3 against the local stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start the local stack
        run: npx supabase start -x studio,imgproxy,logflare,vector
      - name: Seams 1 and 2 (database, functions)
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Seam 3 (browser tracer)
        run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  migrate:
    name: Apply migrations and deploy functions to the hosted project
    if: github.ref == 'refs/heads/main'
    needs: [static, suites]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: supabase db push
        run: npx supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # The edge functions, after the schema they read. Bundled by the API
      # rather than Docker, which the runner does not have set up for it.
      # The project ref is the hosted project's (supabase/config.toml).
      - name: supabase functions deploy
        run: npx supabase functions deploy --use-api --project-ref kokkeqbbfmogfbmbafyz
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
